    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://narivo.site/#website",
          "url": "https://narivo.site/",
          "name": "Narivo",
          "description": "Discover digital tasks on Narivo. Complete sponsored activities, participate in online research and receive rewards for verified contributions.",
          "inLanguage": "en"
        },
        {
          "@type": "Organization",
          "@id": "https://narivo.site/#organization",
          "name": "Narivo",
          "url": "https://narivo.site/",
          "description": "Digital task and rewards platform connecting businesses with people through sponsored digital activities, usability testing, and verified online participation.",
          "email": "support@narivo.site"
        },
        {
          "@type": "FAQPage",
          "@id": "https://narivo.site/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Narivo?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Narivo is a digital task and rewards platform where people discover and complete sponsored digital activities to earn rewards."
              }
            },
            {
              "@type": "Question",
              "name": "How does Narivo work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Businesses sponsor tasks through Narivo. The administration team reviews and publishes approved activities. Registered members complete tasks, submit proof, and earn rewards after verification."
              }
            },
            {
              "@type": "Question",
              "name": "How can I earn rewards on Narivo?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "By discovering available activities, following the task instructions, submitting valid evidence of completion, and having your submission approved by platform reviewers."
              }
            },
            {
              "@type": "Question",
              "name": "What types of digital tasks are available?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Tasks include website testing, app usability testing, online surveys, product research, digital research, and sponsored brand campaigns."
              }
            },
            {
              "@type": "Question",
              "name": "How do I submit completed tasks?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Members submit evidence directly through each task's submission form by uploading screenshots, proof IDs, or written answers as required."
              }
            },
            {
              "@type": "Question",
              "name": "How are submissions verified?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Platform administrators review submitted evidence against task guidelines to confirm genuine participation and data accuracy."
              }
            },
            {
              "@type": "Question",
              "name": "How do I receive my rewards?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Approved rewards are credited to your account wallet. Eligible members can withdraw funds to verified bank accounts."
              }
            },
            {
              "@type": "Question",
              "name": "Are tasks always available?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Task availability depends on active campaigns from corporate sponsors and partners. Availability varies and is never guaranteed."
              }
            },
            {
              "@type": "Question",
              "name": "Can businesses advertise through Narivo?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Businesses can contact Narivo directly to organize sponsored digital tasks, usability tests, and participant research."
              }
            },
            {
              "@type": "Question",
              "name": "How can I contact customer support?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You can reach support via our contact form at narivo.site/contact or by emailing support@narivo.site."
              }
            }
          ]
        }
      ]
    }
